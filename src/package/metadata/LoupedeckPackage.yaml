description: |
  Unofficial plugin that controls Claude Code sessions (Claude desktop app and terminal) from the Logitech MX Creative Keypad (macOS only):
  up to 16 live session slots, Allow Once / Allow in Session / Always Allow / Deny, Stop, next waiting session,
  new code session and new chat / Cowork task, token and context usage, and 5h / weekly usage limits with reset times.
  This is an unofficial community plugin, not affiliated with or endorsed by Anthropic.
  The only network request asks api.anthropic.com for your own usage limits; everything else stays on your Mac.
  Support: dannylabs.studio@gmail.com
